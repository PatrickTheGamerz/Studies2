<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Czarny Ekran</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: black;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <!-- Przycisk w prawym górnym rogu - w pełni przeźroczysty i niewidoczny -->
    <div class="flex justify-end p-10">
        <a href="https://patrickthegamerz.github.io/Studies/" target="_blank"
           class="text-transparent pointer-events-auto cursor-pointer block py-8 px-12">
            SYMULACJA
        </a>
    </div>

    <!-- Przycisk w prawym dolnym rogu - w pełni przeźroczysty i niewidoczny -->
    <div class="flex justify-end p-10">
        <a href="https://gemini.google.com" target="_blank"
           class="text-transparent pointer-events-auto cursor-pointer block py-8 px-12">
            gemini.google.com
        </a>
    </div>

</body>
</html>
